name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: gonzb_connect_test
          POSTGRES_USER: gonzb_connect_test
          POSTGRES_PASSWORD: gonzb_connect_test
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonzb_connect_test -d gonzb_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GONZB_CONNECT_TEST_DATABASE_URL: postgres://gonzb_connect_test:gonzb_connect_test@127.0.0.1:5432/gonzb_connect_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run race tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run vet
        run: go vet ./...

      - name: Install security tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run static analysis
        run: staticcheck ./...

      - name: Check reachable vulnerabilities
        run: govulncheck ./...

      - name: Build commands
        run: go build ./cmd/...

  container:
    name: Build hardened container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build coordinator image
        run: docker build --tag gonzb-connect-coordinator:ci .

      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect gonzb-connect-coordinator:ci --format '{{.Config.User}}')" = "nonroot:nonroot"
          test "$(docker image inspect gonzb-connect-coordinator:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/gonzb-connect-coordinator"]'
