name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: gonzb_connect_test
          POSTGRES_USER: gonzb_connect_test
          POSTGRES_PASSWORD: gonzb_connect_test
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonzb_connect_test -d gonzb_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GONZB_CONNECT_TEST_DATABASE_URL: postgres://gonzb_connect_test:gonzb_connect_test@127.0.0.1:5432/gonzb_connect_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release tag must be semantic, for example v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi

      - name: Require a tag from main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "release tags must point to a commit on main" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release source
        run: |
          go mod verify
          go test -race ./...
          go vet ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist staging
          for arch in amd64 arm64; do
            name="gonzb-connect-coordinator_${version}_linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -o "staging/gonzb-connect-coordinator" ./cmd/gonzb-connect-coordinator
            tar -C staging -czf "dist/${name}.tar.gz" gonzb-connect-coordinator
          done
          go list -m all >dist/modules.txt
          (cd dist && sha256sum *.tar.gz modules.txt >SHA256SUMS)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "gonzb-connect ${GITHUB_REF_NAME}"
          --generate-notes
