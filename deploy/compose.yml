services:
  coordinator:
    build: ..
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2.0
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      # Argon2id uses 64 MiB per enrollment verification. Keep enough memory
      # headroom for bursts of node and TURN-credential registrations.
      MAX_CONCURRENT_AUTH: "2"
      TRUST_PROXY_HEADERS: "true"
      STUN_URIS: "stun:turn.example.com:3478"
      TURN_URIS: "turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp,turns:turn.example.com:5349?transport=tcp"
    secrets: [database_url, admin_token, turn_shared_secret]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    networks: [backend, proxy]

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: gonzb_connect
      POSTGRES_USER: gonzb_connect
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - connect-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonzb_connect -d gonzb_connect"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  coturn:
    image: coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /run/coturn:rw,noexec,nosuid,size=1m,uid=65534,gid=65534,mode=0700
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 2.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf 'static-auth-secret=%s\n' "$$(cat /run/secrets/turn_shared_secret)" > /run/coturn/secret.conf
        exec turnserver -c /run/coturn/secret.conf \
          --fingerprint --use-auth-secret --realm=turn.example.com --server-name=turn.example.com \
          --no-cli --no-multicast-peers --stale-nonce=600 --log-file=stdout \
          --total-quota=$${TURN_TOTAL_QUOTA:-256} --user-quota=$${TURN_USER_QUOTA:-8} \
          --max-bps=$${TURN_MAX_BPS:-10485760} --bps-capacity=$${TURN_BPS_CAPACITY:-104857600} \
          --min-port=49160 --max-port=49260 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.0.2.0-192.0.2.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=198.51.100.0-198.51.100.255 \
          --denied-peer-ip=203.0.113.0-203.0.113.255 \
          --denied-peer-ip=224.0.0.0-255.255.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --cert=/run/tls/fullchain.pem --pkey=/run/tls/privkey.pem
    environment:
      TURN_TOTAL_QUOTA: "${TURN_TOTAL_QUOTA:-256}"
      TURN_USER_QUOTA: "${TURN_USER_QUOTA:-8}"
      TURN_MAX_BPS: "${TURN_MAX_BPS:-10485760}"
      TURN_BPS_CAPACITY: "${TURN_BPS_CAPACITY:-104857600}"
    secrets: [turn_shared_secret]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49260:49160-49260/udp"
    volumes:
      - ./tls:/run/tls:ro
    networks: [turn-edge]

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [proxy, web-edge]

networks:
  backend:
    internal: true
  proxy:
    internal: true
  web-edge:
  turn-edge:

volumes:
  connect-db:
  caddy-data:
  caddy-config:

secrets:
  database_url:
    file: "${DATABASE_URL_FILE:?set DATABASE_URL_FILE to a secret file containing the PostgreSQL DSN}"
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE to the PostgreSQL password file}"
  admin_token:
    file: "${ADMIN_TOKEN_FILE:?set ADMIN_TOKEN_FILE to the admin-token file}"
  turn_shared_secret:
    file: "${TURN_SHARED_SECRET_FILE:?set TURN_SHARED_SECRET_FILE to the coturn shared-secret file}"
